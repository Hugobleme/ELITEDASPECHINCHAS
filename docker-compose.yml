services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 — Banco de Dados Relacional
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: elitedaspechinchas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-elitedaspechinchas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elitedaspechinchas_net

  # ----------------------------------------------------------------------------
  # 2. Redis 7 — Broker de Mensagens Celery & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: elitedaspechinchas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - elitedaspechinchas_net

  # ----------------------------------------------------------------------------
  # 3. API — Backend FastAPI (Uvicorn)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: elitedaspechinchas_api
    restart: unless-stopped
    command: ["api"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-elitedaspechinchas}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://elitedaspechinchas.com.br
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - elitedaspechinchas_net

  # ----------------------------------------------------------------------------
  # 4. Worker — Celery Worker (Parser, Regras, Notificações & Push)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: elitedaspechinchas_worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-elitedaspechinchas}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elitedaspechinchas_net

  # ----------------------------------------------------------------------------
  # 5. Listener — Automação Telethon Userbot (Captura em Tempo Real)
  # ----------------------------------------------------------------------------
  listener:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: elitedaspechinchas_listener
    restart: unless-stopped
    command: ["listener"]
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-elitedaspechinchas}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_SESSION_NAME: sessions/elitedaspechinchas_userbot
    volumes:
      - telethon_sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elitedaspechinchas_net

  # ----------------------------------------------------------------------------
  # 6. Web — Frontend Next.js 14 (App Router)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: elitedaspechinchas_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    networks:
      - elitedaspechinchas_net

# ==============================================================================
# VOLUMES PERSISTENTES
# ==============================================================================
volumes:
  postgres_data:
    name: elitedaspechinchas_postgres_data
  redis_data:
    name: elitedaspechinchas_redis_data
  telethon_sessions:
    name: elitedaspechinchas_telethon_sessions

# ==============================================================================
# REDE INTERNA COMPARTILHADA
# ==============================================================================
networks:
  elitedaspechinchas_net:
    name: elitedaspechinchas_net
    driver: bridge
